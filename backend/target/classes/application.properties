spring.application.name=school-management-backend

# MongoDB Local Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/wesley_school

# Enable auto-index creation for @Indexed fields in documents
spring.data.mongodb.auto-index-creation=true

# Enable MongoDB Auditing (for @CreatedDate, @LastModifiedDate)
spring.data.mongodb.auditing.enabled=true

# Multipart file upload configuration (for PDF circular uploads)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Static resources directory (uploaded files served from here)
spring.web.resources.static-locations=classpath:/static/

# CORS - allow Next.js frontend dev server
server.port=8080
